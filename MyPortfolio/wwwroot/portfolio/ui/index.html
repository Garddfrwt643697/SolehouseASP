<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-кит</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-anim {
            transition: all 0.3s;
        }

            .btn-anim:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            }
    </style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto space-y-12">
        <h1 class="text-3xl font-bold">UI-кит</h1>

        <!-- Кнопки -->
        <section>
            <h2 class="text-xl font-bold mb-4">Кнопки</h2>
            <div class="flex flex-wrap gap-4">
                <button class="px-6 py-3 bg-blue-600 text-white rounded-lg btn-anim">Основная</button>
                <button class="px-6 py-3 bg-gray-200 text-gray-900 rounded-lg btn-anim">Вторичная</button>
                <button class="px-6 py-3 border-2 border-gray-900 text-gray-900 rounded-lg btn-anim">Контур</button>
            </div>
        </section>

        <!-- Карточки -->
        <section>
            <h2 class="text-xl font-bold mb-4">Карточки</h2>
            <div class="grid md:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-xl shadow-sm btn-anim">
                    <h3 class="font-bold">Заголовок</h3>
                    <p class="text-gray-500 text-sm mt-2">Описание карточки.</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm btn-anim">
                    <h3 class="font-bold">Заголовок</h3>
                    <p class="text-gray-500 text-sm mt-2">Описание карточки.</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm btn-anim">
                    <h3 class="font-bold">Заголовок</h3>
                    <p class="text-gray-500 text-sm mt-2">Описание карточки.</p>
                </div>
            </div>
        </section>

        <!-- Форма -->
        <section>
            <h2 class="text-xl font-bold mb-4">Форма</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm max-w-md space-y-4">
                <input type="text" placeholder="Имя" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500">
                <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500">
                <button class="w-full py-3 bg-gray-900 text-white rounded-lg btn-anim">Отправить</button>
            </div>
        </section>
    </div>
</body>
</html>
