<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — SOLEHOUSE</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
        }

        .product-placeholder {
            background: #f3f4f6;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header class="border-b border-gray-200 bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black">SOLE<span class="text-amber-500">HOUSE</span></a>
            <div class="flex items-center gap-4 text-sm font-semibold">
                <button id="geoDisplay" onclick="showGeoModal(); localStorage.removeItem('geo');" class="text-xs text-gray-500 hover:text-amber-500 transition hidden md:block">📍 Выбрать город</button>
                <a href="favorites.html" class="hover:text-amber-500 relative">♡ <span id="favCount" class="bg-amber-500 text-white text-xs rounded-full px-1.5">0</span></a>
                <a href="cart.html" class="hover:text-amber-500 relative">🛒 <span id="cartCount" class="bg-gray-900 text-white text-xs rounded-full px-1.5">0</span></a>
                <div id="authButton"></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <h1 class="text-4xl font-black mb-8">КОРЗИНА</h1>
        <div id="cartPage"></div>
    </main>

    <script src="/portfolio/shop/fallback/js/auth.js"></script>
    <script src="/portfolio/shop/fallback/js/shop.js"></script>
    <script>
        (async () => {
            await loadProducts();
            renderCart();
        })();

        function renderCart() {
            const cart = getCart();
            if (cart.length === 0) {
                document.getElementById('cartPage').innerHTML = `
                        <div class="text-center py-20">
                            <p class="text-2xl font-bold mb-4">Корзина пуста</p>
                            <a href="catalog.html" class="inline-block px-8 py-4 bg-gray-900 text-white font-bold rounded-full hover:bg-amber-500 transition">Перейти в каталог</a>
                        </div>
                    `;
                return;
            }

            let total = 0;
            const items = cart.map(item => {
                const p = PRODUCTS.find(x => x.id === item.id);
                if (!p) return '';
                const sum = p.price * item.qty;
                total += sum;
                return `
                        <div class="flex gap-4 border-b py-4">
                            <div class="w-24 h-24 rounded-xl product-placeholder shrink-0">
                                <img src="/img/barbershop.jpg" class="w-full h-full object-cover" alt="">
                            </div>
                            <div class="flex-1">
                                <p class="text-xs text-gray-500 font-semibold">${p.brand}</p>
                                <h3 class="font-bold">${p.name}</h3>
                                <p class="font-black mt-2">${p.price.toLocaleString('ru-RU')} ₽ × ${item.qty}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-black">${sum.toLocaleString('ru-RU')} ₽</p>
                                <button onclick="removeFromCart(${p.id}); renderCart();" class="text-red-500 text-sm mt-2 hover:underline">Удалить</button>
                            </div>
                        </div>
                    `;
            }).join('');

            const delivery = total >= 5000 ? 0 : 500;
            const finalTotal = total + delivery;

            document.getElementById('cartPage').innerHTML = `
                    <div class="grid md:grid-cols-3 gap-8">
                        <div class="md:col-span-2">${items}</div>
                        <div class="bg-gray-50 p-6 rounded-2xl h-fit sticky top-24">
                            <h2 class="text-xl font-black mb-4">ИТОГО</h2>
                            <div class="flex justify-between mb-2 text-sm"><span>Товары:</span><span>${total.toLocaleString('ru-RU')} ₽</span></div>
                            <div class="flex justify-between mb-2 text-sm"><span>Доставка:</span><span>${delivery === 0 ? 'Бесплатно' : delivery + ' ₽'}</span></div>
                            <div class="flex justify-between text-xl font-black mt-4 pt-4 border-t"><span>Всего:</span><span>${finalTotal.toLocaleString('ru-RU')} ₽</span></div>
                            <button onclick="checkout()" class="mt-6 w-full py-4 bg-gray-900 text-white font-black rounded-xl hover:bg-amber-500 transition">ОФОРМИТЬ ЗАКАЗ</button>
                        </div>
                    </div>
                `;
        }

        function checkout() {
            alert('✓ Заказ оформлен! (демо-версия)');
            localStorage.removeItem('cart');
            updateCartCount();
            renderCart();
        }
    </script>

</body>
</html>
