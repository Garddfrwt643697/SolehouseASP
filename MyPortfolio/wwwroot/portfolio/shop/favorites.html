<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — SOLEHOUSE</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
        }

        .card-hover {
            transition: all 0.3s;
        }

            .card-hover:hover {
                transform: translateY(-6px);
                box-shadow: 0 16px 32px rgba(0,0,0,0.1);
            }

        .product-placeholder {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #9ca3af;
            font-size: 14px;
        }

        .badge-sale {
            background: #ef4444;
            color: white;
        }

        .badge-new {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>

    <div class="bg-gray-900 text-white text-xs text-center py-2">Бесплатная доставка от 5 000 ₽</div>

    <header class="border-b border-gray-200 bg-white">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/portfolio/shop/index.html" class="text-2xl font-black">SOLE<span class="text-amber-500">HOUSE</span></a>
            <a href="/portfolio/shop/catalog.html" class="text-sm font-semibold hover:text-amber-500">← В каталог</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <h1 class="text-4xl font-black mb-8">ИЗБРАННОЕ</h1>
        <div id="favPage"></div>
    </main>

    <script src="/portfolio/shop/js/shop.js"></script>
    <script>
        function renderFavs() {
            const favs = getFavorites();
            const list = PRODUCTS.filter(p => favs.includes(p.id));

            if (list.length === 0) {
                document.getElementById('favPage').innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-2xl font-bold mb-4">Список избранного пуст</p>
                        <a href="/portfolio/shop/catalog.html" class="inline-block px-8 py-4 bg-gray-900 text-white font-bold rounded-full hover:bg-gray-800 transition">Перейти в каталог</a>
                    </div>
                `;
                return;
            }

            document.getElementById('favPage').innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                    ${list.map(productCard).join('')}
                </div>
            `;
        }

        renderFavs();
    </script>

</body>
</html>
